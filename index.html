<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dom Manupulation task</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header id="main-heading">DOM Manupulation practice</header>
    <main>
      <section class="content-section">
        <p id="intro-text">Welcome to Javascript DOM manupulation!</p>
        <button id="change-txt-btn">Change Text</button>
        <button id="change-color-btn">Change Color</button>
      </section>
      <section class="interactive-section">
        <div id="element-container">
          <p>This element can be toggled</p>
        </div>
        <button id="toggled-element-btn">Toggle Element</button>
      </section>
      <section>
        <ul id="list">
          <li>First item</li>
          <li>second item</li>
        </ul>
        <button id="add-item-btn">Add List Item</button>
      </section>
    </main>
    <footer>
      <p>created with Javascript</p>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
